<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Royal Emerald Gradient Background -->
    <radialGradient id="emeraldBg" cx="45%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#0e3a29" />
      <stop offset="55%" stop-color="#051c13" />
      <stop offset="100%" stop-color="#020a06" />
    </radialGradient>

    <!-- Champagne Gold Gradient for Borders and Monogram -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef8e2" />
      <stop offset="25%" stop-color="#f3dda1" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#916e1a" />
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fdf3d4" />
      <stop offset="75%" stop-color="#e2c56a" />
      <stop offset="100%" stop-color="#b8922c" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.4" dy="1.0" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14.5" fill="url(#emeraldBg)" />

  <!-- Outer Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.95" />

  <!-- Inner Fine Accent Ring -->
